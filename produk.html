<body data-shell="light">
<div data-layout="header"></div>
<main id="main">
  <section class="catalog-head">
    <div class="container">
      <h1 data-split>Produk</h1>
      <p class="lead">Harganya ngikut etalase Tokopedia kami; tanaman hidup kami kirim ke Jabodetabek saja, yang lain bisa ke mana saja.</p>
    </div>
  </section>

  <section class="catalog">
    <div class="container">
      <form class="catalog-filters" role="search" aria-label="Cari dan saring produk" data-filters>
        <div class="catalog-filters__row">
          <div class="catalog-search">
            <label for="q" class="visually-hidden">Cari produk</label>
            <svg class="icon catalog-search__icon" aria-hidden="true"><use href="assets/icons/sprite.svg#i-search"/></svg>
            <input id="q" name="q" type="search" class="input" placeholder="Cari monstera, aroid mix, pupuk NPK…" autocomplete="off" spellcheck="false">
          </div>
          <div class="catalog-tags" role="group" aria-label="Kategori" data-cats></div>
        </div>
        <div class="catalog-bar">
          <div class="catalog-bar__count">
            <p class="catalog-count" aria-live="polite" data-count>160 produk di rak ini</p>
            <button type="button" class="catalog-clear link-u" data-reset data-clear hidden>Hapus filter</button>
          </div>
          <label class="catalog-sort">
            <span class="catalog-sort__label">Urutkan</span>
            <span class="catalog-sort__field">
              <select id="urut" name="urut" class="select">
                <option value="unggulan">Unggulan</option>
                <option value="terlaris">Terlaris</option>
                <option value="murah">Harga terendah</option>
                <option value="mahal">Harga tertinggi</option>
                <option value="nama">Nama A-Z</option>
              </select>
              <svg class="icon catalog-sort__icon" aria-hidden="true"><use href="assets/icons/sprite.svg#i-chevron-down"/></svg>
            </span>
          </label>
        </div>
      </form>

      <h2 class="visually-hidden">Daftar produk</h2>
      <ul class="rak catalog-rak" data-grid></ul>

      <div class="catalog-empty" data-empty hidden>
        <p class="catalog-empty__title h2">Di rak ini belum ada yang cocok.</p>
        <p class="muted">Coba kata lain, atau tanya kami: stoknya kami cek langsung.</p>
        <div class="cluster catalog-empty__actions">
          <button type="button" class="btn" data-reset>Hapus filter</button>
          <a class="btn btn-fill" data-empty-wa href="#" target="_blank" rel="noopener"><svg class="icon" aria-hidden="true"><use href="assets/icons/sprite.svg#i-brand-whatsapp"/></svg>Tanya via WhatsApp</a>
        </div>
      </div>
    </div>
  </section>
</main>
<div data-layout="footer"></div>
